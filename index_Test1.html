<title>血液分野① 合格テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single reading column. Home = 3 set cards; test = all questions of the round in one scroll with a sticky submit bar. Palette from Color Hunt #FFF5E4 #FFE3E1 #FFD1D1 #FF9494. */
:root{
  --paper:#FFF5E4; --blush:#FFE3E1; --rose:#FFD1D1; --coral:#FF9494;
  --card:#FFFCF6; --ink:#3B2427; --muted:#7D5E60; --accent:#C04A55; --on-coral:#3B1418;
  --ok:#2F8465; --ok-bg:#DDF1E7; --line:#F3CFCB;
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#231A1B; --blush:#3A2A2C; --rose:#5B3B3F; --coral:#FF9494; --card:#2C2223; --ink:#F6E8E4; --muted:#C7ABA9; --accent:#FFA3A3;
  --ok:#7ED3AE; --ok-bg:#1F3A2F; --line:#4A3336; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#231A1B; --blush:#3A2A2C; --rose:#5B3B3F; --coral:#FF9494; --card:#2C2223; --ink:#F6E8E4; --muted:#C7ABA9; --accent:#FFA3A3;
  --ok:#7ED3AE; --ok-bg:#1F3A2F; --line:#4A3336; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:28px 8px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,6vw,34px);line-height:1.3;margin:4px 0 0;text-wrap:balance}
h1 .mark{background:linear-gradient(transparent 62%,var(--rose) 62%)}
h2{font-family:var(--f-disp);font-size:20px;margin:0;text-wrap:balance}
.lead{color:var(--muted);font-size:14px;margin:10px 0 0;max-width:60ch}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px 22px}
@media (max-width:480px){.card{padding:16px;border-radius:14px}}
.stack{display:grid;gap:14px;margin-top:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.field input{width:100%;font:inherit;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.sets{grid-template-columns:1fr}}
.set{display:flex;flex-direction:column;gap:8px}
.set .range{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.set .topics{font-size:13px;color:var(--muted);line-height:1.6;flex:1}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--blush);color:var(--muted);align-self:flex-start}
.pill.go{background:var(--rose);color:var(--ink)} .pill.done{background:var(--ok-bg);color:var(--ok)}
.btn{font:inherit;font-size:15px;font-weight:700;border-radius:10px;padding:9px 18px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);font-weight:500;font-size:13px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13px;color:var(--accent);min-height:1.4em;margin:6px 0 0}

.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.qno{font-family:var(--f-disp);font-weight:700;font-size:20px;color:var(--accent)}
.tag{font-size:12px;background:var(--coral);color:var(--on-coral);font-weight:700;padding:1px 10px;border-radius:999px}
.stem{font-size:16.5px;font-weight:500;margin:2px 0 12px}
.fig{margin:0 0 14px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);max-width:400px}
.fig img{display:block;width:100%}
.opts{display:grid;gap:7px;list-style:none;padding:0;margin:0}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;cursor:pointer}
.opt:hover{background:var(--blush)}
.opt .num{font-family:var(--f-mono);font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--blush);color:var(--muted);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--coral);background:var(--blush)}
.opt[aria-pressed="true"] .num{background:var(--coral);color:var(--on-coral)}
.qstat{font-size:13px;font-weight:700;color:var(--accent);margin:10px 0 0;text-align:right}
.qstat.ok{color:var(--ok)}
.card.miss{border-color:var(--coral);box-shadow:0 0 0 3px var(--rose)}
.submitbar{position:sticky;bottom:0;margin-top:18px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-size:14px;color:var(--muted)} .count b{font-family:var(--f-mono);color:var(--ink);font-size:18px}

.score{font-family:var(--f-mono);font-size:44px;line-height:1.1;color:var(--ink)}
.score small{font-size:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--f-mono);font-size:13px;padding:2px 10px;border-radius:8px;background:var(--blush);color:var(--accent);border:1.5px solid var(--rose)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

.pass{border:3px solid var(--coral);text-align:center;padding:28px 20px;position:relative;overflow:hidden}
.pass .stamp{font-family:var(--f-disp);font-weight:700;font-size:64px;line-height:1;color:var(--accent);letter-spacing:.1em}
.pass dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;text-align:left;max-width:380px;margin:20px auto 0;font-size:15px}
.pass dt{color:var(--muted);font-size:13px;padding-top:2px}
.pass dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.pass .clock{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:16px}
.handout{margin:18px auto 0;max-width:34em;background:var(--blush);border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.7}
.handout b{color:var(--accent)}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
.hist th,.hist td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:12px;color:var(--muted);font-weight:500}
footer{margin-top:28px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.pass .stamp{animation:pop .5s ease-out}@keyframes pop{from{transform:scale(1.4);opacity:0}to{transform:none;opacity:1}}}
</style>

const SETS = [
  {id:1, from:1,  to:12, topics:"造血・好中球・赤血球指数・DIC・TTP・血小板・アンチトロンビン"},
  {id:2, from:13, to:24, topics:"特殊染色・自動血球計数・白血病・骨髄腫・血小板機能・凝固・網赤血球・鉄欠乏"},
  {id:3, from:25, to:36, topics:"AML・骨髄増殖性腫瘍・白血球・凝固線溶・溶血・再生不良性貧血・血栓性素因"}
];
const KEY = "ketsueki1-test-v1";
function fnv(s){ let h = 0x811c9dc5; for (const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
const isRight = (q, orig) => fnv(`kt1|${q.n}|${[...orig].sort((a,b)=>a-b).join(",")}`) === q.k;

let S;
try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) { S = null; }
if (!S || !S.sets) S = { name:"", sid:"", sets:{} };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
let view = { screen:"home" };

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fmt = t => { const d = new Date(t), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const shuffle = a => { a = [...a]; for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const Qn = n => Q.find(q => q.n === n);

function newRound(st, nums){
  st.round = { no: st.history.length + 1, qs: [...nums].sort((a,b) => a-b).map(n => ({ n, perm: shuffle([1,2,3,4,5]), sel: [] })) };
}
function startSet(id){
  let st = S.sets[id];
  if (!st){
    const set = SETS[id-1], nums = [];
    for (let n = set.from; n <= set.to; n++) nums.push(n);
    st = S.sets[id] = { started: Date.now(), history: [], passed: null, name: S.name, sid: S.sid };
    newRound(st, nums);
  }
  save(); view = { screen: st.passed ? "pass" : st.round ? "test" : "result", id }; render(); window.scrollTo(0,0);
}

function home(){
  const cards = SETS.map(set => {
    const st = S.sets[set.id];
    let pill = `<span class="pill">未受験</span>`, label = "受験をはじめる";
    if (st && st.passed){ pill = `<span class="pill done">合格 ${fmt(st.passed)}</span>`; label = "合格画面を見る"; }
    else if (st && st.round){ pill = `<span class="pill go">第${st.round.no}回 受験中・${st.round.qs.length}問</span>`; label = "続きから"; }
    return `<div class="card set"><h2>セット${set.id}</h2><span class="range">問${set.from}〜問${set.to}（12問）</span>${pill}
      <p class="topics">${set.topics}</p><button class="btn ${st && st.passed ? "" : "primary"}" data-start="${set.id}">${label}</button></div>`;
  }).join("");
  return `<p class="lead">12問ずつ3セットに分かれています。1セットを全問正解すると合格です。間違えた問題は、正解を見ずに何度でも解き直します。合格画面は先生に見せてください。</p>
  <div class="stack">
    <div class="card"><div class="fields">
      <div class="field"><label for="sid">学籍番号</label><input id="sid" autocomplete="off" value="${esc(S.sid)}" placeholder="例）2224001"></div>
      <div class="field"><label for="name">氏名</label><input id="name" autocomplete="off" value="${esc(S.name)}" placeholder="例）群馬 花子"></div>
    </div><p class="msg" id="msg"></p></div>
    <div class="sets">${cards}</div>
  </div>`;
}

function test(){
  const st = S.sets[view.id], r = st.round, done = r.qs.filter(x => x.sel.length === (Qn(x.n).two ? 2 : 1)).length;
  const items = r.qs.map((x, i) => {
    const q = Qn(x.n), need = q.two ? 2 : 1;
    return `<article class="card" id="q${x.n}">
      <div class="qhead"><span class="qno">問題 ${q.n}</span>${q.two ? '<span class="tag">2つ選ぶ</span>' : ""}</div>
      <p class="stem">${esc(q.q)}</p>
      ${q.img ? `<figure class="fig"><img src="${IMG[q.img]}" alt="問題${q.n}の標本写真"></figure>` : ""}
      <ol class="opts">${x.perm.map((orig, k) => `<li><button class="opt" data-i="${i}" data-o="${orig}" aria-pressed="${x.sel.includes(orig)}"><span class="num">${k+1}</span><span>${esc(q.o[orig-1])}</span></button></li>`).join("")}</ol>
      <p class="qstat ${x.sel.length === need ? "ok" : ""}" id="st${x.n}">${stat(x.sel.length, need)}</p>
    </article>`;
  }).join("");
  return `<div class="stack"><div><h2>セット${view.id}　第${r.no}回</h2>
    <p class="lead">${r.no === 1 ? "12問すべてに答えてから採点してください。" : `前回間違えた${r.qs.length}問です。選択肢の順番は毎回入れ替わります。`}</p></div>
    ${items}</div>
    <p class="msg" id="gmsg" role="status"></p><div class="submitbar"><span class="count">解答済み <b>${done}</b> / ${r.qs.length}</span>
      <span style="display:flex;gap:8px"><button class="btn ghost" id="home">中断してもどる</button><button class="btn primary" id="grade">採点する</button></span></div>`;
}

function result(){
  const st = S.sets[view.id], h = st.history[st.history.length-1];
  return `<div class="stack"><div class="card">
      <h2>セット${view.id}　第${h.no}回の結果</h2>
      <div class="score" style="margin-top:10px">${h.correct}<small> / ${h.total} 問正解</small></div>
      <p class="note" style="margin-top:14px">間違えた問題</p>
      <div class="chips">${h.wrong.map(n => `<span class="chip">問${n}</span>`).join("")}</div>
      <p class="note">どこで迷ったかを思い出してから解き直しましょう。正解は合格後に紙の解説で確認します。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn primary" id="retry">間違えた${h.wrong.length}問を解き直す</button><button class="btn ghost" id="home">あとで解く</button></div>
    </div></div>`;
}

function pass(){
  const st = S.sets[view.id], set = SETS[view.id-1], first = st.history[0];
  return `<div class="stack"><div class="card pass">
      <div class="eyebrow">血液分野①　セット${set.id}（問${set.from}〜問${set.to}）</div>
      <div class="stamp" style="margin-top:12px">合格</div>
      <dl>
        <dt>学籍番号</dt><dd>${esc(st.sid)}</dd>
        <dt>氏名</dt><dd>${esc(st.name)}</dd>
        <dt>初回の得点</dt><dd>${first.correct} / ${first.total} 問</dd>
        <dt>合格までの回数</dt><dd>${st.history.length} 回</dd>
        <dt>開始</dt><dd>${fmt(st.started)}</dd>
        <dt>合格</dt><dd>${fmt(st.passed)}</dd>
      </dl>
      <div class="clock" id="clock"></div>
      <p class="handout">この画面を先生に見せて、<b>解説シート${"①②③"[set.id-1]}</b>を受け取ってください。<br>☆の穴埋めを終えてから次のセットへ進みましょう。</p>
    </div>
    <div class="card"><h2 style="font-size:16px">受験の記録</h2>
      <table class="hist"><thead><tr><th>回</th><th>出題</th><th>正解</th><th>間違えた問題</th></tr></thead><tbody>
      ${st.history.map(h => `<tr><td>${h.no}</td><td>${h.total}</td><td>${h.correct}</td><td>${h.wrong.length ? h.wrong.map(n => "問"+n).join("・") : "—"}</td></tr>`).join("")}
      </tbody></table></div>
    <div><button class="btn" id="home">セット一覧にもどる</button></div></div>`;
}

function stat(k, need){ return k === need ? "解答済み" : need === 2 ? (k === 0 ? "2つ選んでください" : "あと1つ選んでください") : "未解答"; }
function render(){
  const app = document.getElementById("app");
  app.innerHTML = view.screen === "home" ? home() : view.screen === "test" ? test() : view.screen === "result" ? result() : pass();
  tick();
}
function tick(){ const c = document.getElementById("clock"); if (c) c.textContent = "表示時刻 " + new Date().toLocaleString("ja-JP"); }
setInterval(tick, 1000);

function grade(){
  const st = S.sets[view.id], r = st.round;
  const wrong = r.qs.filter(x => !isRight(Qn(x.n), x.sel)).map(x => x.n).sort((a,b) => a-b);
  st.history.push({ no: r.no, total: r.qs.length, correct: r.qs.length - wrong.length, wrong, at: Date.now() });
  st.round = null;
  if (!wrong.length){ st.passed = Date.now(); view.screen = "pass"; } else view.screen = "result";
  save(); render(); window.scrollTo(0,0);
}

document.getElementById("app").addEventListener("input", e => {
  if (e.target.id === "name") S.name = e.target.value.trim();
  if (e.target.id === "sid") S.sid = e.target.value.trim();
  save();
});
document.getElementById("app").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.start){
    if (!S.name || !S.sid){ document.getElementById("msg").textContent = "学籍番号と氏名を入力してから始めてください。"; return; }
    return startSet(+t.dataset.start);
  }
  if (t.classList.contains("opt")){
    const st = S.sets[view.id], x = st.round.qs[+t.dataset.i], o = +t.dataset.o, need = Qn(x.n).two ? 2 : 1;
    if (x.sel.includes(o)) x.sel = x.sel.filter(v => v !== o);
    else x.sel = need === 1 ? [o] : x.sel.length < 2 ? [...x.sel, o] : [x.sel[1], o];
    save();
    const card = t.closest(".card");
    card.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", x.sel.includes(+b.dataset.o)));
    const done = st.round.qs.filter(y => y.sel.length === (Qn(y.n).two ? 2 : 1)).length;
    document.querySelector(".count b").textContent = done;
    const sl = document.getElementById("st" + x.n); sl.textContent = stat(x.sel.length, need); sl.classList.toggle("ok", x.sel.length === need);
    card.classList.remove("miss"); document.getElementById("gmsg").textContent = "";
    return;
  }
  if (t.id === "grade"){
    const st = S.sets[view.id], miss = st.round.qs.filter(y => y.sel.length !== (Qn(y.n).two ? 2 : 1));
    if (miss.length){
      document.querySelectorAll(".card.miss").forEach(c => c.classList.remove("miss"));
      miss.forEach(y => document.getElementById("q" + y.n).classList.add("miss"));
      document.getElementById("gmsg").textContent = `まだ答えていない問題があります：${miss.map(y => "問" + y.n).join("・")}`;
      document.getElementById("q" + miss[0].n).scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    return grade();
  }
  if (t.id === "retry"){ const st = S.sets[view.id]; newRound(st, st.history[st.history.length-1].wrong); save(); view.screen = "test"; render(); window.scrollTo(0,0); return; }
  if (t.id === "home"){ view = { screen:"home" }; render(); window.scrollTo(0,0); }
});
document.getElementById("resetArea").addEventListener("click", e => {
  const a = document.getElementById("resetArea");
  if (e.target.id === "reset") a.innerHTML = `記録と合格をすべて消しますか？ <button class="btn" id="yes">消す</button><button class="btn ghost" id="no">やめる</button>`;
  if (e.target.id === "yes"){ S = { name:"", sid:"", sets:{} }; save(); view = { screen:"home" }; render(); }
  if (e.target.id === "yes" || e.target.id === "no") a.innerHTML = `<button class="btn ghost" id="reset">この端末の記録をリセット</button>`;
});
render();
</script>
